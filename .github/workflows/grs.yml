name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Generate stats card
        run: |
          python3 << 'EOF'
          import json
          import urllib.request
          
          username = "mohamedamine99"
          url = f"https://api.github.com/users/{username}"
          
          with urllib.request.urlopen(url) as response:
              data = json.loads(response.read())
          
          repos = data.get('public_repos', 0)
          followers = data.get('followers', 0)
          following = data.get('following', 0)
          name = data.get('name', username)
          bio = data.get('bio', 'Computer Vision Engineer')
          
          svg = f'''<svg width="600" height="180" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <style>
                .bg {{ fill: #0d1117; }}
                .title {{ font-size: 28px; font-weight: bold; fill: #58a6ff; font-family: 'Segoe UI', Ubuntu, Sans-Serif; }}
                .label {{ font-size: 14px; fill: #8b949e; font-family: 'Segoe UI', Ubuntu, Sans-Serif; }}
                .value {{ font-size: 18px; font-weight: bold; fill: #58a6ff; font-family: 'Segoe UI', Ubuntu, Sans-Serif; }}
              </style>
            </defs>
            <rect class="bg" width="600" height="180"/>
            <rect x="1" y="1" width="598" height="178" rx="6" fill="none" stroke="#30363d" stroke-width="1"/>
            <text x="30" y="45" class="title">{name}</text>
            <text x="30" y="70" class="label">{bio}</text>
            
            <text x="30" y="115" class="label">📊 Stats</text>
            <text x="30" y="145" class="value">Repositories: {repos}</text>
            <text x="280" y="145" class="value">Followers: {followers}</text>
            <text x="30" y="170" class="value">Following: {following}</text>
          </svg>'''
          
          with open('profile/stats.svg', 'w') as f:
              f.write(svg)
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "chore: update stats [skip ci]" || exit 0
          git push
